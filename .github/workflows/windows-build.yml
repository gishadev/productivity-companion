name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

# One build per ref, cancel in-progress runs on new pushes
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_NAME: productivity-companion

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    steps:
      # Checkout repository (including submodules and Git LFS)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      # Free up runner disk space; the Unity editor image is large
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Cache the Library folder to speed up subsequent builds
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      # Build the project for Windows (64-bit)
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.BUILD_NAME }}

      # The builder runs as root inside the container
      - name: Fix permissions
        run: sudo chown -R $USER:$USER build

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64

      - name: Zip Build
        run: |
          cd build/StandaloneWindows64
          zip -r "../../${{ env.BUILD_NAME }}-${{ github.ref_name }}-win64.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_NAME }}-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
